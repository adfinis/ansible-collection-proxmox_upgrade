---

version: 2
updates:
  # Maintain GitHub Action dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
